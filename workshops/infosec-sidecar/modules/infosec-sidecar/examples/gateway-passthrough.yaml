# Istio's own Gateway resource, not Gateway API: OpenShift's Ingress
# Operator owns every gateway.networking.k8s.io CRD and TLSRoute isn't
# among the ones it installs, so Gateway API cannot route raw TLS here.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: infosec-passthrough
  namespace: istio-ingress
spec:
  selector:
    istio: infosec-passthrough
  servers:
  - port:
      number: 8443
      name: tls-passthrough
      protocol: TLS
    tls:
      mode: PASSTHROUGH
    hosts:
    # <namespace>/<host>: only VirtualServices in payments may bind.
    - "payments/payments.APPS_DOMAIN"
