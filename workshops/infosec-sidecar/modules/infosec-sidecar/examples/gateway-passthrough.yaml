apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infosec-passthrough
  namespace: istio-ingress
  annotations:
    # The gateway Service stays ClusterIP; an OpenShift Route
    # (or MetalLB, see the MetalLB tab) exposes it.
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
  - name: tls-passthrough
    protocol: TLS
    port: 443
    hostname: "*.APPS_DOMAIN"
    tls:
      mode: Passthrough
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            infosec.example/passthrough: "true"
