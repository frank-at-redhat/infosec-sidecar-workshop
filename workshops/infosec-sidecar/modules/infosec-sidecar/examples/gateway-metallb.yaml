# Alternative to the Route: let MetalLB give the gateway Service a VIP.
# Replaces the Service from gateway-deployment.yaml.
apiVersion: v1
kind: Service
metadata:
  name: infosec-passthrough
  namespace: istio-ingress
  annotations:
    metallb.universe.tf/address-pool: mesh-ingress
spec:
  type: LoadBalancer
  selector:
    istio: infosec-passthrough
  ports:
  - name: tls
    port: 443
    targetPort: 8443
