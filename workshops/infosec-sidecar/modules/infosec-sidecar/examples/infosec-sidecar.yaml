# The external application and its InfoSec sidecar: one pod, three
# containers, no mesh injection. On a RHEL host the same three run
# as processes; the Envoy and agent configuration is identical.
apiVersion: v1
kind: Namespace
metadata:
  name: payments-client
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch
  namespace: payments-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: payments-client
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire"
      log_level = "INFO"
      server_address = "spire-server.ext-spire.svc"
      server_port = "8081"
      socket_path = "/run/spire/sockets/agent.sock"
      trust_domain = "ext.example"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      sds {
        default_svid_name = "default"
        default_bundle_name = "ROOTCA"
        default_all_bundles_name = "ALL"
      }
    }
    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "ext"
          token_path = "/var/run/secrets/tokens/spire-agent"
        }
      }
      KeyManager "memory" {
        plugin_data {}
      }
      WorkloadAttestor "unix" {
        plugin_data {
          discover_workload_path = true
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
  namespace: payments-client
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 15000 }
    static_resources:
      listeners:
      - name: app_ingress
        address:
          socket_address: { address: 127.0.0.1, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: app_ingress
              cluster: mesh_app
      clusters:
      - name: mesh_app
        type: STRICT_DNS
        connect_timeout: 5s
        load_assignment:
          cluster_name: mesh_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: payments.APPS_DOMAIN
                    port_value: 443
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: payments.APPS_DOMAIN
            common_tls_context:
              alpn_protocols: ["istio"]
              tls_certificate_sds_secret_configs:
              - name: default
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                    - envoy_grpc:
                        cluster_name: spire_agent
              validation_context_sds_secret_config:
                name: spiffe://cluster.local
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                    - envoy_grpc:
                        cluster_name: spire_agent
      - name: spire_agent
        connect_timeout: 1s
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: spire_agent
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  pipe:
                    path: /run/spire/sockets/agent.sock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: payments-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      serviceAccountName: batch
      # The unix workload attestor matches Envoy by its executable
      # path, so the agent must see Envoy's process.
      shareProcessNamespace: true
      containers:
      - name: app
        image: registry.access.redhat.com/ubi9/ubi-minimal
        command: ["sleep", "infinity"]
      - name: infosec-envoy
        image: docker.io/envoyproxy/envoy:v1.33.0
        args: ["-c", "/etc/envoy/envoy.yaml", "-l", "info"]
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
        - name: spire-socket
          mountPath: /run/spire/sockets
      - name: infosec-spire-agent
        image: ghcr.io/spiffe/spire-agent:1.13.3
        args: ["-config", "/run/spire/config/agent.conf"]
        volumeMounts:
        - name: agent-config
          mountPath: /run/spire/config
          readOnly: true
        - name: spire-socket
          mountPath: /run/spire/sockets
        - name: ext-bundle
          mountPath: /run/spire/bundle
          readOnly: true
        - name: agent-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: envoy
      - name: agent-config
        configMap:
          name: spire-agent
      - name: ext-bundle
        configMap:
          name: ext-bundle
      - name: spire-socket
        emptyDir: {}
      - name: agent-token
        projected:
          sources:
          - serviceAccountToken:
              path: spire-agent
              audience: spire-server
              expirationSeconds: 7200
