apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    istio-injection: enabled
    infosec.example/passthrough: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments
  namespace: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        spiffe.io/spire-managed-identity: "true"
      annotations:
        inject.istio.io/templates: sidecar,spire
    spec:
      serviceAccountName: payments
      containers:
      - name: payments
        image: registry.access.redhat.com/ubi9/httpd-24
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: payments
spec:
  selector:
    app: payments
  ports:
  - name: http
    port: 8080
    targetPort: 8080
