# /etc/spire/server.conf on the RHEL host that runs the external
# trust domain. MESH_APPS is the cluster's *.apps domain.
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "ext.example"
  data_dir = "/var/lib/spire/server"
  log_level = "INFO"
  default_x509_svid_ttl = "1h"
  ca_subject {
    country = ["US"]
    organization = ["Workshop"]
    common_name = "External SPIRE CA"
  }
  federation {
    bundle_endpoint {
      address = "0.0.0.0"
      port = 8443
      profile "https_spiffe" {}
    }
    federates_with "cluster.local" {
      bundle_endpoint_url = "https://federation.MESH_APPS"
      bundle_endpoint_profile "https_spiffe" {
        endpoint_spiffe_id = "spiffe://cluster.local/spire/server"
      }
    }
  }
}
plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
}
