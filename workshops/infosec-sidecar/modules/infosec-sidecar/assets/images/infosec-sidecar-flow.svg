<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Red Hat Text, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4d4d4d"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#4d4d4d;stroke-width:1.25}
    .key{fill:#fdf1ec;stroke:#ee0000;stroke-width:2}
    .dom{fill:none;stroke:#8a8d90;stroke-width:1.25;stroke-dasharray:6 4}
    .n{font-weight:600;fill:#151515}
    .s{fill:#4d4d4d;font-size:11.5px}
    .d{fill:#6a6e73;font-weight:600}
    .c{fill:none;stroke:#4d4d4d;stroke-width:1.25}
  </style>
  <rect class="dom" x="24" y="16" width="712" height="144" rx="8"/>
  <text class="d" x="40" y="38">External trust domain, spiffe://ext.example (VM or other cluster)</text>
  <rect class="box" x="40" y="56" width="226" height="72" rx="8"/>
  <text class="n" x="153" y="80" text-anchor="middle">External application</text>
  <text class="s" x="153" y="100" text-anchor="middle">No TLS code of its own</text>
  <text class="s" x="153" y="116" text-anchor="middle">Talks plaintext to localhost</text>
  <rect class="key" x="290" y="56" width="226" height="88" rx="8"/>
  <text class="n" x="403" y="80" text-anchor="middle">InfoSec sidecar</text>
  <text class="s" x="403" y="100" text-anchor="middle">Envoy + SPIRE agent</text>
  <text class="s" x="403" y="116" text-anchor="middle">X.509 SVID via SDS socket</text>
  <text class="s" x="403" y="132" text-anchor="middle">Originates mTLS, ALPN istio</text>
  <rect class="box" x="540" y="56" width="180" height="72" rx="8"/>
  <text class="n" x="630" y="80" text-anchor="middle">External SPIRE server</text>
  <text class="s" x="630" y="100" text-anchor="middle">Attests node + workload</text>
  <text class="s" x="630" y="116" text-anchor="middle">Issues SVIDs</text>
  <rect class="dom" x="24" y="200" width="712" height="344" rx="8"/>
  <text class="d" x="40" y="218">OpenShift + Service Mesh 3 (Istio), spiffe://cluster.local</text>
  <rect class="box" x="40" y="264" width="340" height="72" rx="8"/>
  <text class="n" x="210" y="288" text-anchor="middle">Istio ingress gateway</text>
  <text class="s" x="210" y="308" text-anchor="middle">Istio Gateway, tls.mode PASSTHROUGH</text>
  <text class="s" x="210" y="324" text-anchor="middle">VirtualService matches SNI, no termination</text>
  <rect class="key" x="40" y="360" width="340" height="88" rx="8"/>
  <text class="n" x="210" y="384" text-anchor="middle">istio-proxy sidecar</text>
  <text class="s" x="210" y="404" text-anchor="middle">PeerAuthentication STRICT</text>
  <text class="s" x="210" y="420" text-anchor="middle">Validates SVID against federated bundle</text>
  <text class="s" x="210" y="436" text-anchor="middle">AuthorizationPolicy on spiffe:// principal</text>
  <rect class="box" x="40" y="472" width="340" height="56" rx="8"/>
  <text class="n" x="210" y="496" text-anchor="middle">Mesh application (payments)</text>
  <text class="s" x="210" y="516" text-anchor="middle">Receives plaintext on localhost</text>
  <rect class="box" x="540" y="360" width="180" height="88" rx="8"/>
  <text class="n" x="630" y="384" text-anchor="middle">ZTWIM SPIRE server</text>
  <text class="s" x="630" y="404" text-anchor="middle">Mesh CA, sidecar mode</text>
  <text class="s" x="630" y="420" text-anchor="middle">Entry federatesWith ext</text>
  <text class="s" x="630" y="436" text-anchor="middle">Serves bundle via SDS</text>
  <g class="c">
    <path d="M266 92H290" marker-end="url(#a)"/>
    <path d="M540 92H516" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <path d="M403 144V236H210V264" marker-end="url(#a)"/>
    <path d="M210 336V360" marker-end="url(#a)"/>
    <path d="M210 448V472" marker-end="url(#a)"/>
    <path d="M540 404H380" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <path d="M630 128V360" stroke-dasharray="4 4" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text class="s" x="414" y="174">mTLS, SNI = mesh app hostname</text>
  <text class="s" x="620" y="260" text-anchor="end">trust bundle federation</text>
  <text class="s" x="460" y="396" text-anchor="middle">SVID + bundles</text>
</svg>
